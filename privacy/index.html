<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Privacy Policy — Zero Cloud Data Retention | Splitly</title>
    <meta name="title" content="Privacy Policy — Zero Cloud Data Retention | Splitly" />
    <meta name="description" content="Splitly privacy policy. Zero server PII collection, user responsibility for transaction links and exported JSON/CSV data, and complete privacy disclaimers." />
    <meta name="keywords" content="splitly privacy policy, private expense splitter, zero server PII storage, transaction link disclaimer, exported JSON CSV disclaimer, browser local storage privacy" />
    <meta name="author" content="@itsdheeraj.me" />
    <link rel="canonical" href="https://splitly.in/privacy/" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA & Mobile Theme -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitly" />

    <!-- Instant Inline CSS to Prevent FOUC -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app-initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .app-loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .app-loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: app-loader-spin 0.75s linear infinite;
        margin-top: 1.25rem;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- 5-Second Maximum Timeout Safeguard -->
    <script>
      (function() {
        var loaderTimeout = setTimeout(function() {
          var loader = document.getElementById("app-initial-loader");
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 5000);
        window.__clearAppLoaderTimeout = function() {
          clearTimeout(loaderTimeout);
        };
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://splitly.in/privacy/" />
    <meta property="og:title" content="Privacy Policy — Splitly" />
    <meta property="og:description" content="100% Client-Side Privacy Policy. Zero PII storage, user responsibility for transaction links & exported files, and complete disclaimers." />
    <meta property="og:image" content="https://splitly.in/logo-512.png" />
    <meta property="og:site_name" content="Splitly" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@itsdheeraj" />
    <meta name="twitter:title" content="Privacy Policy — Splitly" />
    <meta name="twitter:description" content="Read our zero-tracking privacy policy, transaction link & exported data disclaimers, and legal immunity guidelines." />
    <meta name="twitter:image" content="https://splitly.in/logo-512.png" />

    <!-- Structured Data (JSON-LD WebPage) -->
    <script type="application/ld+json" id="seo-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Privacy Policy",
      "description": "Privacy disclosure detailing zero PII storage, transaction link & exported JSON/CSV data disclaimers, and local browser persistence.",
      "url": "https://splitly.in/privacy/"
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader">
        <img src="/logo-128.png" alt="Splitly" class="app-loader-logo" />
        <div class="app-loader-spinner"></div>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 1rem; font-weight: 500;">Loading Splitly...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
