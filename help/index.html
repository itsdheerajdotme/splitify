<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Help & Guide — How to Split Expenses Offline | Splitly</title>
    <meta name="title" content="Help & Guide — How to Split Expenses Offline | Splitly" />
    <meta name="description" content="Step-by-step instructions on creating trip sessions, 4 bill split modes (Equal, %, Shares, Custom), installing the PWA, generating 24-hr share links, and managing offline data." />
    <meta name="keywords" content="how to split bills, expense splitter tutorial, equal bill split guide, install splitly pwa, offline trip bill calculator guide" />
    <meta name="author" content="@itsdheeraj.me" />
    <link rel="canonical" href="https://splitly.in/help/" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA & Mobile Theme -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitly" />

    <!-- Instant Inline CSS to Prevent FOUC -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app-initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .app-loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .app-loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: app-loader-spin 0.75s linear infinite;
        margin-top: 1.25rem;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- 5-Second Maximum Timeout Safeguard -->
    <script>
      (function() {
        var loaderTimeout = setTimeout(function() {
          var loader = document.getElementById("app-initial-loader");
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 5000);
        window.__clearAppLoaderTimeout = function() {
          clearTimeout(loaderTimeout);
        };
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://splitly.in/help/" />
    <meta property="og:title" content="Help & User Guide — Splitly Expense Splitter" />
    <meta property="og:description" content="Learn how to calculate group balances, install the offline PWA, and share trip links securely." />
    <meta property="og:image" content="https://splitly.in/logo-512.png" />
    <meta property="og:site_name" content="Splitly" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@itsdheeraj" />
    <meta name="twitter:title" content="Help & Guide — Splitly" />
    <meta name="twitter:description" content="Step-by-step user guide for splitting trip expenses, managing group balances, and offline usage." />
    <meta name="twitter:image" content="https://splitly.in/logo-512.png" />

    <!-- Structured Data (JSON-LD FAQPage) -->
    <script type="application/ld+json" id="seo-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Splitly calculate group balances?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Splitly uses an intelligent greedy debt simplification algorithm to minimize total payments between group members into the fewest possible direct transactions."
          }
        },
        {
          "@type": "Question",
          "name": "Is my financial expense data stored on a central server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Splitly stores 100% of your session and expense data locally inside your device browser using IndexedDB. No accounts or server logins are required."
          }
        },
        {
          "@type": "Question",
          "name": "How do temporary trip share links work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you generate a share link, a temporary copy of your trip data is uploaded for 24 hours. Friends can import the trip directly into their browser, after which the link automatically expires and deletes itself."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Splitly without an internet connection?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Splitly is built as a Progressive Web App (PWA). You can install it on iOS, Android, or Desktop and run it completely offline without internet."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader">
        <img src="/logo-128.png" alt="Splitly" class="app-loader-logo" />
        <div class="app-loader-spinner"></div>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 1rem; font-weight: 500;">Loading Splitly...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
